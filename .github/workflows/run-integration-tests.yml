name: Integration tests

on:
  workflow_call:
    inputs:
      aws-region: { required: true, type: string }
      stack-name: { required: true, type: string }
      stack-outputs: { required: true, type: string }
    secrets:
      aws_role_arn: { required: true }
      api-gateway-api-key: { required: true }
      ipv-core-stub-basic-auth-pwd: { required: true }
      ipv-core-stub-basic-auth-user: { required: true }

permissions: {}

concurrency:
  group: integration-tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Integration
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: di-ipv-cri-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          gradle-version: '9.6.1'

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Run tests
        env:
          ENVIRONMENT: localdev
          AWS_REGION: ${{ inputs.aws-region }}
          STACK_NAME: ${{ inputs.stack-name }}
          API_GATEWAY_ID_PUBLIC: ${{ fromJson(inputs.stack-outputs).PublicAddressApiGatewayId }}
          API_GATEWAY_ID_PRIVATE: ${{ fromJson(inputs.stack-outputs).PrivateAddressApiGatewayId }}
          APIGW_API_KEY: ${{ secrets.api-gateway-api-key }}
        run: ./gradlew --no-daemon integration-tests:cucumber
