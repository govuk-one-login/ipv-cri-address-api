name: Deploy preview

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      stack-name:
        description: The deployed stack name
        value: ${{ jobs.deploy.outputs.stack-name }}
      stack-outputs:
        description: The deployed stack outputs
        value: ${{ jobs.deploy.outputs.stack-outputs }}
      aws-region:
        description: The region in which the stack was deployed
        value: ${{ jobs.deploy.outputs.aws-region }}

jobs:
  build:
    name: Build SAM app
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      cache-key: ${{ steps.build.outputs.cache-key }}
      cache-restore-keys: ${{ steps.build.outputs.cache-restore-keys }}
    environment:
      name: development
    steps:
      - name: Pull repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@b9bee63ef481cc545e4517ec730544a4d8b1dfa0 # v6.4.0
        with:
          gradle-version: '9.6.1'

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: corretto
          cache: gradle

      - name: Build SAM application
        uses: govuk-one-login/github-actions/sam/build-application@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: build
        with:
          template: infrastructure/lambda/template.yaml
          cache-name: address-api
          pull-repository: false
          source-dir: lambdas
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}

  deploy:
    name: Deploy stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-development-${{ github.head_ref || github.ref_name }}
    environment:
      name: development
      url: ${{ steps.deploy.outputs.stack-url }}
    outputs:
      aws-region: ${{ steps.deploy.outputs.aws-region }}
      stack-name: ${{ steps.deploy.outputs.stack-name }}
      stack-outputs: ${{ steps.deploy.outputs.stack-outputs }}
    steps:
      - name: Set timestamp
        id: set_timestamp
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Deploy stack
        uses: govuk-one-login/github-actions/sam/deploy-stack@b5f4f92a0692bf297b08c43745e545e45631f0ee
        id: deploy
        with:
          sam-deployment-bucket: ${{ vars.DEPLOYMENT_ARTIFACTS_BUCKET }}
          aws-role-arn: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          stack-name-prefix: preview
          stack-name-length-limit: '20'
          cache-key: ${{ needs.build.outputs.cache-key }}
          cache-restore-keys: ${{ needs.build.outputs.cache-restore-keys }}
          s3-prefix: preview
          pull-repository: true
          delete-failed-stack: true
          tags: |
            cri:component=ipv-cri-address-api
            cri:stack-type=preview
            cri:application=Orange
            cri:deployment-source=github-actions
          parameters: |
            Environment=localdev
            SecretPrefix=pre-merge-test
            ForceLambdaUpdate=${{ steps.set_timestamp.outputs.timestamp }}
