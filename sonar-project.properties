sonar.projectKey=ipv-cri-address-api-ts
sonar.organization=govuk-one-login

sonar.sources=lambdas,infrastructure

sonar.inclusions=\
**/*.ts,\
infrastructure/**/*.yaml

sonar.exclusions=\
**/node_modules/**,\
**/*.d.ts,\
**/tests/**,\
**/*.test.ts,\
**/*.spec.ts,\
**/coverage/**,\
**/build/**

sonar.tests=lambdas

sonar.test.inclusions=\
**/tests/**/*.test.ts,\
**/*.test.ts,\
**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
